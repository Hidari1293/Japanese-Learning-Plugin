<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>预览 · 划词卡片</title>
<style>
  body{margin:0;background:#faf8f4;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:#1f1c18}
  .page{max-width:640px;margin:0 auto;padding:56px 28px 220px}
  h1{font-size:26px;font-weight:500;letter-spacing:.04em;margin:0 0 6px}
  .meta{font-size:12px;color:#9a9084;font-family:sans-serif;margin-bottom:34px;letter-spacing:.08em}
  p{font-size:16px;line-height:2.1;margin:0 0 22px;letter-spacing:.02em}
  .target{background:#fff5cc;padding:2px 1px;border-radius:2px}
  .tip{font-family:sans-serif;font-size:11.5px;color:#a09789;margin-top:40px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="page">
  <h1>京都の秋を歩く</h1>
  <div class="meta">2026年11月4日 · 旅の記録</div>
  <p>朝の光が石畳に落ちると、町はゆっくりと目を覚ます。路地の奥からは、<span class="target" id="w">懐かしい</span>匂いが漂ってきた。子供の頃に通った駄菓子屋の記憶が、ふいに蘇る。</p>
  <p id="s" class="target">静かな庭に、赤い葉が一枚だけ落ちていた。</p>
  <p>誰も急がず、誰も立ち止まらない。そんな午後が、いちばん長く心に残るのだと思う。</p>
  <div class="tip">这是样式预览页，用的是示例数据。?mode=sent 看句子模式，?mode=form 看动词变形，&amp;theme=light 强制浅色。</div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') || 'word';

  if (q.get('theme') === 'light') {
    const orig = window.matchMedia.bind(window);
    window.matchMedia = (s) => (/prefers-color-scheme:\s*dark/.test(s)
      ? { matches: false, media: s, addEventListener() {}, removeEventListener() {} }
      : orig(s));
  }

  const MOCK_WORD = {
    ok: true, query: '懐かしい', matched: '懐かしい', reading: 'なつかしい',
    pos: 'イ形容词', posAlt: '', jlpt: 'N3', common: true,
    cn: '令人怀念的；怀旧的', cnFrom: 'en',
    en: ['dear (old)', 'fondly remembered', 'nostalgic'],
    note: '懐かしい<b>音楽</b>を聞く　·　多用于回忆过去的美好时光',
    tag: '', inLocal: false
  };

  const MOCK_FORM = Object.assign({}, MOCK_WORD, {
    query: '懐かしかった', matched: '懐かしい'
  });

  const MOCK_SENT = {
    ok: true, text: '静かな庭に、赤い葉が一枚だけ落ちていた。',
    cn: '寂静的庭院里，只落着一片红叶。'
  };

  window.chrome = {
    runtime: {
      lastError: null,
      sendMessage: (msg, cb) => setTimeout(() => cb(
        msg.type === 'lookup' ? (mode === 'form' ? MOCK_FORM : MOCK_WORD) : MOCK_SENT
      ), 40),
      onMessage: { addListener() {} }
    },
    storage: {
      local: { get: () => Promise.resolve({}), set: () => Promise.resolve() },
      onChanged: { addListener() {} }
    }
  };
</script>
<script src="../dict-local.js"></script>
<script src="../content.js"></script>
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const node = document.getElementById(mode === 'sent' ? 's' : 'w');
      const range = document.createRange();
      range.selectNodeContents(node);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const r = node.getBoundingClientRect();
      document.dispatchEvent(new MouseEvent('mouseup', {
        bubbles: true, cancelable: true, button: 0,
        clientX: r.left + 8, clientY: r.top + 6
      }));
    }, 350);
  });
</script>
</body>
</html>

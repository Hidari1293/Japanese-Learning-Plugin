<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>词库与抽测 · 左右日语</title>
<link rel="stylesheet" href="study.css">
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">
      <div class="mark">あ</div>
      <div>
        <h1>词库与抽测</h1>
        <p>左右日语 · 划词词典</p>
      </div>
    </div>
    <span class="grow"></span>
    <div class="topstat">
      <div><b id="tsDecks">0</b><span>词库</span></div>
      <div><b id="tsWords">0</b><span>词汇</span></div>
      <div><b id="tsMastered">0</b><span>已掌握</span></div>
      <div><b id="tsAcc">—</b><span>正确率</span></div>
    </div>
    <button class="tbtn" id="themeBtn" type="button" title="切换深浅色">跟随系统</button>
  </header>

  <!-- ① 词库列表 -->
  <section id="v-list">
    <div class="sechead">
      <h2>我的词库</h2>
      <span class="sub">点词库进去看词，点抽测开始复习</span>
      <span class="grow"></span>
      <button class="btn ghost" id="importBtn" type="button">导入生词 JSON</button>
    </div>
    <div class="decks" id="decks"></div>
    <p class="sub" style="margin-top:14px;font-size:11.5px;color:var(--dim)">
      抽测按「错题数 × 掌握等级」加权出题：错得越多、等级越低，出现得越频繁。
    </p>
  </section>

  <!-- ② 单词库 -->
  <section id="v-deck" hidden>
    <div class="sechead">
      <button class="btn ghost" id="backHome" type="button">← 词库</button>
      <h2 id="dtitle">词库</h2>
      <span class="sub" id="dsub"></span>
    </div>
    <div class="typebar">
      <span class="tlabel">选择题型</span>
      <div class="chips" id="qtypes">
        <button class="chip on" data-t="mix" type="button">混合</button>
        <button class="chip" data-t="cn2jp" type="button">中文 → 日语</button>
        <button class="chip" data-t="jp2cn" type="button">日语 → 中文</button>
        <button class="chip" data-t="jp2kana" type="button">日语 → 假名</button>
      </div>
      <span class="grow"></span>
      <button class="btn" id="qFlip" type="button">翻卡片抽测</button>
      <button class="btn primary" id="qChoice" type="button">选择题抽测</button>
    </div>
    <div class="toolbar">
      <div class="chips" id="filters">
        <button class="chip on" data-f="all" type="button">全部</button>
        <button class="chip" data-f="weak" type="button">待复习</button>
        <button class="chip" data-f="wrong" type="button">错过的</button>
        <button class="chip" data-f="done" type="button">已掌握</button>
      </div>
      <span class="grow"></span>
      <input class="search" id="search" type="search" placeholder="搜词 / 读音 / 释义" autocomplete="off">
    </div>
    <div class="words" id="words"></div>
  </section>

  <!-- ③ 抽测 -->
  <section id="v-quiz" hidden>
    <div class="qhead">
      <button class="btn ghost" id="quitQuiz" type="button">← 退出</button>
      <div id="qmode" style="font-family:var(--serif);font-size:14px"></div>
      <span class="grow"></span>
      <div class="qstat">
        <span>本轮<b id="qSeen">0</b></span>
        <span>正确<b id="qRight" class="ok">0</b></span>
        <span>连对<b id="qStreak">0</b></span>
      </div>
    </div>
    <div class="qbar"><span id="qfill"></span></div>
    <div id="qbody"></div>
  </section>

  <footer class="foot">
    <kbd>空格</kbd> 翻面 / 下一题
    <kbd>1</kbd>–<kbd>4</kbd> 选项
    <kbd>Esc</kbd> 关闭 / 退出
    <span class="grow"></span>
    <span>数据只存在本地浏览器</span>
  </footer>
</div>

<script src="deck-n3.js"></script>
<script src="study.js"></script>
</body>
</html>
